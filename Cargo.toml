[workspace]
members = [
    "src/rust/heimdallrs-core",
    "src/rust/heimdallrs-macros",
    "src/rust/heimdallrs-messages",
    "src/rust/heimdallrs-utils",
    "modules/logger/telegraf-rs/"
]
resolver = "2"
exclude = ["contrib"]

[workspace.package]
version = "4.0.0"
license = "LGPL-2.1-or-later"

[workspace.dependencies]
heimdallrs-core = { path = "src/rust/heimdallrs-core" }
heimdallrs-macros = { path = "src/rust/heimdallrs-macros" }
