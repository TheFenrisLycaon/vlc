name: Heimdall
options:
  bundleIdPrefix: com.lycaria.heimdall
  supportedDestinations: [iOS, tvOS, visionOS, watchOS]
  deploymentTarget:
    iOS: 9.0
    tvOS: 12.0
    visionOS: 1.0
    watchOS: 7.4
configs:
  Debug: debug
  Release: release
settings:
  configs:
fileGroups:
  - "${HEIMDALL_SRC_DIR}/bin"
  - "${HEIMDALL_SRC_DIR}/src"
  - "${HEIMDALL_SRC_DIR}/include"
  - "${HEIMDALL_SRC_DIR}/modules"
  - "${HEIMDALL_SRC_DIR}/lib"
  - "${HEIMDALL_SRC_DIR}/test"
  - "${HEIMDALL_SRC_DIR}/contrib/src"
  - "${HEIMDALL_SRC_DIR}/contrib/bootstrap"
  - "${HEIMDALL_SRC_DIR}/doc"
  - "${HEIMDALL_SRC_DIR}/extras/package/apple/"
targets:
  HeimdallAutomake:
    type: ""
    supportedDestinations: [iOS, tvOS, visionOS, watchOS]
    legacy:
      toolPath: ${HEIMDALL_SRC_DIR}/extras/package/apple/xcode.sh
      passSettings: true
      workingDirectory: ${HEIMDALL_SRC_DIR}

  heimdallcoreios:
    type: "application"
    supportedDestinations: [iOS, tvOS, visionOS]
    dependencies:
      - target: HeimdallAutomake
      - target: heimdall
      - target: heimdallcore
    info:
      path: "heimdallcoreios/Info.plist"
      properties:
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.lycaria.heimdall.heimdallcoreios
    postBuildScripts:
      - script: ${HEIMDALL_SRC_DIR}/extras/package/apple/copy_plugins.sh
        name: "Copy Heimdall plugins"

      - name: Install Heimdall share data
        shell: /bin/bash
        script: |
            set -e
            archs=(${ARCHS})
            arch="${archs[0]}"
            build_root="${BUILT_PRODUCTS_DIR}/build-${PLATFORM_NAME}-${arch}${BUILD_SUFFIX}/build"
            make -C "${build_root}/share" install-data \
                DESTDIR="${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}" \
                prefix=/ \
                datadir=/share

      - name: Copy heimdallcoreios binary
        shell: /bin/bash
        script: |
            INPUT_FILES=()
            for arch in ${ARCHS}; do
                INPUT_FILES+=("${BUILT_PRODUCTS_DIR}/build-${PLATFORM_NAME}-${arch}${BUILD_SUFFIX}/build/test/.libs/heimdallcoreios")
            done
            lipo -create \
                -output "${BUILT_PRODUCTS_DIR}/${EXECUTABLE_PATH}" \
                "${INPUT_FILES[@]}"
            install_name_tool -change "@rpath/libheimdall.dylib" "@rpath/heimdall.framework/heimdall" \
                "${BUILT_PRODUCTS_DIR}/${EXECUTABLE_PATH}"
            install_name_tool -change "@rpath/libheimdallcore.dylib" "@rpath/heimdallcore.framework/heimdallcore" \
                "${BUILT_PRODUCTS_DIR}/${EXECUTABLE_PATH}"
            codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY}" "${BUILT_PRODUCTS_DIR}/${EXECUTABLE_PATH}"

  heimdallcorewatchos:
    type: "application"
    platform: [watchOS]
    dependencies:
      - target: HeimdallAutomake
      - target: heimdall
      - target: heimdallcore
    info:
      path: "heimdallcorewatchos/Info.plist"
      properties:
        CFBundleIdentifier: com.lycaria.heimdall.heimdallcore.watchapp
        WKCompanionAppBundleIdentifier: com.lycaria.heimdall.heimdallcore
        WKRunsIndependentlyOfCompanionApp: true
        WKApplication: true
        UIBackgroundModes:
          - audio
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.lycaria.heimdall.heimdallcoreios.watchapp
    postBuildScripts:
      - script: ${HEIMDALL_SRC_DIR}/extras/package/apple/copy_plugins.sh
        name: "Copy Heimdall plugins"

      - name: Copy heimdallcorewatchos binary
        shell: /bin/bash
        script: |
            INPUT_FILES=()
            for arch in ${ARCHS}; do
                INPUT_FILES+=("${BUILT_PRODUCTS_DIR}/build-${PLATFORM_NAME}-${arch}${BUILD_SUFFIX}/build/test/.libs/heimdallcorewatchos")
            done
            lipo -create \
                -output "${BUILT_PRODUCTS_DIR}/${EXECUTABLE_PATH}" \
                "${INPUT_FILES[@]}"
            install_name_tool -change "@rpath/libheimdall.dylib" "@rpath/heimdall.framework/heimdall" \
                "${BUILT_PRODUCTS_DIR}/${EXECUTABLE_PATH}"
            install_name_tool -change "@rpath/libheimdallcore.dylib" "@rpath/heimdallcore.framework/heimdallcore" \
                "${BUILT_PRODUCTS_DIR}/${EXECUTABLE_PATH}"
            codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY}" "${BUILT_PRODUCTS_DIR}/${EXECUTABLE_PATH}"

  heimdall:
    type: "framework"
    supportedDestinations: [iOS, tvOS, visionOS, watchOS]
    dependencies:
      - target: HeimdallAutomake
    info:
      path: "heimdall/Info.plist"

    postBuildScripts:
      - name: Copy libheimdall library
        shell: /bin/bash
        script: |
            INPUT_FILES=()
            for arch in ${ARCHS}; do
                input_file="${BUILT_PRODUCTS_DIR}/build-${PLATFORM_NAME}-${arch}${BUILD_SUFFIX}/build/lib/.libs/libheimdall.dylib"
                echo " + Adding input $input_file"
                INPUT_FILES+=( "$input_file" )
            done
            FRAMEWORK_DIR="${BUILT_PRODUCTS_DIR}/heimdall.framework"
            FRAMEWORK_BIN_PATH="${FRAMEWORK_DIR}/heimdall"
            lipo -create \
                -output "${FRAMEWORK_BIN_PATH}" \
                "${INPUT_FILES[@]}"
            dsymutil -o "${FRAMEWORK_DIR}.dSYM" "${FRAMEWORK_BIN_PATH}"

  heimdallcore:
    type: "framework"
    supportedDestinations: [iOS, tvOS, visionOS, watchOS]
    dependencies:
      - target: HeimdallAutomake
    info:
      path: "heimdallcore/Info.plist"
    sources:
      - path: ${HEIMDALL_SRC_DIR}/include/
        includes: "heimdall_*.h"
        buildPhase: headers
        headerVisibility: public
    postBuildScripts:
      - name: Copy heimdallcore library
        shell: /bin/bash
        buildRules:
        script: |
            INPUT_FILES=()
            for arch in ${ARCHS}; do
                input_file="${BUILT_PRODUCTS_DIR}/build-${PLATFORM_NAME}-${arch}/build/src/.libs/libheimdallcore.dylib"
                echo " + Adding input $input_file"
                INPUT_FILES+=( "$input_file" )
            done
            FRAMEWORK_DIR="${BUILT_PRODUCTS_DIR}/heimdallcore.framework"
            FRAMEWORK_BIN_PATH="${FRAMEWORK_DIR}/heimdallcore"
            lipo -create \
                -output "${FRAMEWORK_BIN_PATH}" \
                "${INPUT_FILES[@]}"
            # We have to generate dSYM bundle here because Xcode might
            # already have generated them before script execution
            dsymutil -o "${FRAMEWORK_DIR}.dSYM" "${FRAMEWORK_BIN_PATH}"

